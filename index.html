<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator - By Fahim</title>
</head>

<body>
    <div class="calculator-container">
        <div class="calculator">
            <input type="text" placeholder="0" id="inputbox">
            <div>
                <button>AC</button>
                <button>DEL</button>
                <button>%</button>
                <button>/</button>
            </div>
            <div>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>
            </div>
            <div>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
            </div>
            <div>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
            </div>
            <div>
                <button>00</button>
                <button>0</button>
                <button>.</button>
                <button class="eqlbtn">=</button>
            </div>
        </div>


        <div class="history-panel">
            <div class="history-header">
                <h3>History</h3>
                <button id="clearHistory">Clear</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
